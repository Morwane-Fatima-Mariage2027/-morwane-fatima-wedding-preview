<script>
const T={fr:{place:"MARRAKECH · MAROC",stamp:"MARRAKECH<br>25—26 MAI<br>2027",date:"MAI 2027 · DAR LAYYINA",route:"AGADEZ · MARRAKECH",aria:"Ouvrir l’invitation"},en:{place:"MARRAKECH · MOROCCO",stamp:"MARRAKECH<br>MAY 25—26<br>2027",date:"MAY 2027 · DAR LAYYINA",route:"AGADEZ · MARRAKECH",aria:"Open the invitation"},ar:{place:"مراكش · المغرب",stamp:"مراكش<br>25—26 مايو<br>2027",date:"مايو 2027 · دار ليانا",route:"أغاديز · مراكش",aria:"فتح الدعوة"}};
const scene=document.getElementById("scene"),seal=document.getElementById("seal");let opened=false;
function setLang(l){document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";document.querySelectorAll("[data-t]").forEach(e=>e.innerHTML=T[l][e.dataset.t]);document.querySelectorAll(".lang").forEach(b=>b.classList.toggle("on",b.dataset.lang===l));seal.setAttribute("aria-label",T[l].aria);localStorage.setItem("mt-entry-lang",l)}
