<style>

<body>
<main class="stage" id="stage">
<div class="langs" aria-label="Language"><button class="lang active" data-lang="fr">FR</button><button class="lang" data-lang="en">EN</button><button class="lang" data-lang="ar">العربية</button></div>
<section class="intro">
<div class="whisper" data-t="whisper">UNE INVITATION POUR VOUS</div>
<div class="envelope" id="envelope">
<div class="env-back"></div><div class="liner"></div>
<div class="card"></div><div class="flap"></div>
<button class="seal" id="seal" aria-label="Ouvrir l'invitation">M&T</button>
</div>
<div class="open-hint" data-t="open">TOUCHEZ LE SCEAU</div>
</section>
<section class="invitation">
<div class="invite-sheet">
<div class="topline"><span data-t="place">MARRAKECH · MAROC</span><span class="coords">31.6295° N<br>7.9811° W</span></div>
<div class="photo-composition">
<div class="photo-frame"><img src="https://raw.githubusercontent.com/Morwane-Fatima-Mariage2027/morwane-fatima-destination-weddind/main/couple.jpeg" alt="Morwane et Tatta"></div>
<div class="stamp"><span data-t="stamp">MARRAKECH<br>25—26 MAI<br>2027</span></div>
<div class="names"><span>Morwane</span><span class="and">&</span><span class="tatta">Tatta</span></div>
<div class="dateblock"><span class="bigdate">25—26</span><span class="datewords" data-t="date">MAI 2027<br>DAR LAYYINA</span></div>
<div class="route"><svg viewBox="0 0 180 70"><path d="M3 55 C38 7,72 64,105 28 S152 15,176 2"/><circle cx="176" cy="2" r="3" fill="#c8a875"/></svg></div>
</div>
<button class="journey" data-t="journey">NOTRE VOYAGE COMMENCE ICI</button>
<div class="micro">ⵣ</div>
</div>
</section>
</main>
<script>
const text={
fr:{whisper:"UNE INVITATION POUR VOUS",open:"TOUCHEZ LE SCEAU",place:"MARRAKECH · MAROC",stamp:"MARRAKECH<br>25—26 MAI<br>2027",date:"MAI 2027<br>DAR LAYYINA",journey:"NOTRE VOYAGE COMMENCE ICI",aria:"Ouvrir l’invitation"},
en:{whisper:"AN INVITATION, JUST FOR YOU",open:"TOUCH THE SEAL",place:"MARRAKECH · MOROCCO",stamp:"MARRAKECH<br>MAY 25—26<br>2027",date:"MAY 2027<br>DAR LAYYINA",journey:"THE JOURNEY BEGINS HERE",aria:"Open the invitation"},
ar:{whisper:"دعوة خاصة لكم",open:"المسوا الختم",place:"مراكش · المغرب",stamp:"مراكش<br>25—26 مايو<br>2027",date:"مايو 2027<br>دار ليانا",journey:"من هنا تبدأ رحلتنا",aria:"افتحوا الدعوة"}};
const stage=document.getElementById("stage"),seal=document.getElementById("seal");
function lang(l){document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";document.querySelectorAll("[data-t]").forEach(e=>e.innerHTML=text[l][e.dataset.t]);document.querySelectorAll(".lang").forEach(b=>b.classList.toggle("active",b.dataset.lang===l));seal.setAttribute("aria-label",text[l].aria);localStorage.setItem("mt-entry-lang",l)}
document.querySelectorAll(".lang").forEach(b=>b.onclick=()=>lang(b.dataset.lang));
seal.onclick=()=>{if(stage.classList.contains("open"))return;stage.classList.add("open");setTimeout(()=>stage.classList.add("invited"),1700)};
document.querySelector(".card").onclick=()=>stage.classList.add("invited");
lang(localStorage.getItem("mt-entry-lang")||"fr");
</script></body></html>
